name: Deploy to Azure VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Start VM
        run: az vm start -g medical-ai-rg -n medical-ai-vm

      - name: Wait for VM
        run: sleep 30

      - name: Copy files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          source: "."
          target: "/home/azureuser/app"

      - name: Create .env and deploy
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          script: |
            cd /home/azureuser/app

            # Laravel .env
            cat > api-backend/.env << 'ENVEOF'
            APP_NAME=MediScan
            APP_ENV=production
            APP_KEY=${{ secrets.APP_KEY }}
            APP_DEBUG=false
            APP_URL=http://${{ secrets.VM_HOST }}
            DB_CONNECTION=mysql
            DB_HOST=database
            DB_PORT=3306
            DB_DATABASE=laravel_db
            DB_USERNAME=laravel_user
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            FASTAPI_URL=http://ai-engine:5000
            FASTAPI_TIMEOUT=30
            SESSION_DRIVER=database
            QUEUE_CONNECTION=database
            CACHE_STORE=database
            LOG_CHANNEL=stack
            LOG_LEVEL=error
            MAIL_MAILER=smtp
            MAIL_HOST=smtp.gmail.com
            MAIL_PORT=465
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            MAIL_FROM_ADDRESS=${{ secrets.MAIL_USERNAME }}
            MAIL_FROM_NAME="Medical-AI project"
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_REDIRECT_URI=http://${{ secrets.VM_HOST }}/api/v1/auth/google/callback
            STRIPE_KEY=${{ secrets.STRIPE_KEY }}
            STRIPE_SECRET=${{ secrets.STRIPE_SECRET }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            FIREBASE_CREDENTIALS=storage/app/firebase-credentials.json
            ENVEOF

            # AI Engine .env
            cat > ai-engine/.env << 'ENVEOF'
            SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
            GROQ_KEY=${{ secrets.GROQ_KEY }}
            NVIDIA_API_KEY=${{ secrets.NVIDIA_API_KEY }}
            CLOUDFLARE_API_KEY=${{ secrets.CLOUDFLARE_API_KEY }}
            CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            DEBUG=false
            ENVEOF

            docker compose build
            docker compose up -d
            sleep 10
            docker exec laravel-app php artisan migrate --force
            docker exec laravel-app php artisan storage:link --force
            docker image prune -f

      - name: Stop VM
        run: az vm deallocate -g medical-ai-rg -n medical-ai-vm
