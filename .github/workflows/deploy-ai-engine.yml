name: Deploy AI Engine to ACR

on:
  push:
    branches: [Yousef]
    paths:
      - 'ai-engine/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        run: |
          docker login ${{ secrets.ACR_LOGIN_SERVER }} \
            --username ${{ secrets.ACR_USERNAME }} \
            --password ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push
        run: |
          docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/ai-engine:latest ./ai-engine
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/ai-engine:latest
